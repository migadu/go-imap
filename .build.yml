image: alpine/latest
packages:
  - dovecot
  - go
sources:
  - https://github.com/migadu/go-imap#main
tasks:
  - build: |
      cd go-imap
      go build -race -v ./...
  - test: |
      cd go-imap
      go test -race ./...
  - test-dovecot: |
      cd go-imap
      GOIMAP_TEST_DOVECOT=1 go test -race ./imapclient
  - gofmt: |
      cd go-imap
      test -z $(gofmt -l .)
